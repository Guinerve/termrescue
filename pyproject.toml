[project]
name = "termrescue"
version = "0.1.0"
description = "Switch off terminal modes, such as mouse reporting, that a program left on when its SSH link dropped."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
termrescue = "termrescue.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
