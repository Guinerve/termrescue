[project]
name = "termrescue"
version = "0.1.0"
description = "Clear terminal modes (mouse reporting, focus events, ...) left on by programs that died, e.g. over a dropped SSH link."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
termrescue = "termrescue.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
