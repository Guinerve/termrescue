<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" role="img" aria-labelledby="title desc">
<title id="title">termrescue: before and after</title>
<desc id="desc">Two real zsh sessions. A program turns on mouse reporting and is killed. Without termrescue, mouse movement types escape codes into the next command. With termrescue, the prompt switches mouse reporting off and the command runs.</desc>
<style>
.mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 14px; }
.label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 600; letter-spacing: .04em; }
.junk { fill: #ff7b72; }
.ok { fill: #3fb950; }
</style>
<g transform="translate(0 0)">
<rect x="0.5" y="0.5" width="489" height="299" rx="10" fill="#0d1117" stroke="#30363d"/>
<path d="M0.5 36 V10.5 A10 10 0 0 1 10.5 0.5 H479.5 A10 10 0 0 1 489.5 10.5 V36 Z" fill="#161b22"/>
<circle cx="20" cy="18" r="5.5" fill="#ff5f57"/><circle cx="38" cy="18" r="5.5" fill="#febc2e"/><circle cx="56" cy="18" r="5.5" fill="#28c840"/>
<text x="245" y="23" text-anchor="middle" class="label junk">ZSH WITHOUT TERMRESCUE</text>
<text class="mono" xml:space="preserve">
<tspan x="16" y="62"><tspan fill="#58a6ff">~</tspan><tspan fill="#e6edf3"> % ./dies-in-mouse-mode</tspan></tspan>
<tspan x="16" y="86"><tspan fill="#58a6ff">~</tspan><tspan fill="#e6edf3"> % 35;30;6M35;31;7M35;32;8Mecho hello</tspan></tspan>
<tspan x="16" y="110"><tspan fill="#e6edf3">zsh: command not found: 35</tspan></tspan>
<tspan x="16" y="134"><tspan fill="#e6edf3">zsh: command not found: 30</tspan></tspan>
<tspan x="16" y="158"><tspan fill="#e6edf3">zsh: command not found: 6M35</tspan></tspan>
<tspan x="16" y="182"><tspan fill="#e6edf3">zsh: command not found: 31</tspan></tspan>
<tspan x="16" y="206"><tspan fill="#e6edf3">zsh: command not found: 7M35</tspan></tspan>
<tspan x="16" y="230"><tspan fill="#e6edf3">zsh: command not found: 32</tspan></tspan>
<tspan x="16" y="254"><tspan fill="#e6edf3">zsh: command not found: 8Mecho</tspan></tspan>
<tspan x="16" y="278"><tspan fill="#58a6ff">~</tspan><tspan fill="#e6edf3"> %</tspan></tspan>
</text>
</g>
<g transform="translate(510 0)">
<rect x="0.5" y="0.5" width="489" height="299" rx="10" fill="#0d1117" stroke="#30363d"/>
<path d="M0.5 36 V10.5 A10 10 0 0 1 10.5 0.5 H479.5 A10 10 0 0 1 489.5 10.5 V36 Z" fill="#161b22"/>
<circle cx="20" cy="18" r="5.5" fill="#ff5f57"/><circle cx="38" cy="18" r="5.5" fill="#febc2e"/><circle cx="56" cy="18" r="5.5" fill="#28c840"/>
<text x="245" y="23" text-anchor="middle" class="label ok">ZSH WITH TERMRESCUE</text>
<text class="mono" xml:space="preserve">
<tspan x="16" y="62"><tspan fill="#58a6ff">~</tspan><tspan fill="#e6edf3"> % ./dies-in-mouse-mode</tspan></tspan>
<tspan x="16" y="86"><tspan fill="#58a6ff">~</tspan><tspan fill="#e6edf3"> % echo hello</tspan></tspan>
<tspan x="16" y="110"><tspan fill="#e6edf3">hello</tspan></tspan>
<tspan x="16" y="134"><tspan fill="#58a6ff">~</tspan><tspan fill="#e6edf3"> %</tspan></tspan>
</text>
</g>
</svg>
