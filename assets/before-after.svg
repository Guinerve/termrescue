<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" role="img" aria-labelledby="title desc">
  <title id="title">termrescue: before and after</title>
  <desc id="desc">Illustration. Left: after an SSH session drops, every mouse movement types escape codes into PowerShell. Right: with termrescue the prompt stays clean.</desc>
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 14px; }
    .label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 600; letter-spacing: .04em; }
    .prompt { fill: #58a6ff; }
    .cmd { fill: #e6edf3; }
    .dim { fill: #7d8590; }
    .junk { fill: #ff7b72; }
    .ok { fill: #3fb950; }
  </style>

  <!-- left: without -->
  <g>
    <rect x="0.5" y="0.5" width="459" height="299" rx="10" fill="#0d1117" stroke="#30363d"/>
    <path d="M0.5 36 V10.5 A10 10 0 0 1 10.5 0.5 H449.5 A10 10 0 0 1 459.5 10.5 V36 Z" fill="#161b22"/>
    <circle cx="20" cy="18" r="5.5" fill="#ff5f57"/><circle cx="38" cy="18" r="5.5" fill="#febc2e"/><circle cx="56" cy="18" r="5.5" fill="#28c840"/>
    <text x="230" y="23" text-anchor="middle" class="label junk">WITHOUT TERMRESCUE</text>
    <text class="mono" xml:space="preserve">
      <tspan x="18" y="66"><tspan class="prompt">PS C:\Users\me&gt;</tspan><tspan class="cmd"> ssh mac</tspan></tspan>
      <tspan x="18" y="90" class="dim">Connection to mac closed.</tspan>
      <tspan x="18" y="114"><tspan class="prompt">PS C:\Users\me&gt;</tspan><tspan class="junk"> [&lt;35;45;23M[&lt;35;46;23M[&lt;35;4</tspan></tspan>
      <tspan x="18" y="138" class="junk">7;23M[&lt;35;48;23M[&lt;35;49;24M[&lt;0;49;24M[&lt;0;4</tspan>
      <tspan x="18" y="162" class="junk">9;24m[&lt;35;50;24M[&lt;35;51;24M[&lt;35;52;25M[&lt;35</tspan>
      <tspan x="18" y="186" class="junk">;53;25M[&lt;35;54;25M[&lt;35;55;26M[&lt;35;56;26M[&lt;</tspan>
      <tspan x="18" y="210" class="junk">35;57;26M[&lt;35;58;27M[&lt;0;58;27M[&lt;0;58;27m[&lt;3</tspan>
      <tspan x="18" y="234" class="junk">5;59;27M[&lt;35;60;28M[&lt;35;61;28M[&lt;35;62;28M</tspan>
      <tspan x="18" y="270" class="dim">every mouse move is typed into your shell</tspan>
    </text>
  </g>

  <!-- right: with -->
  <g transform="translate(500 0)">
    <rect x="0.5" y="0.5" width="459" height="299" rx="10" fill="#0d1117" stroke="#30363d"/>
    <path d="M0.5 36 V10.5 A10 10 0 0 1 10.5 0.5 H449.5 A10 10 0 0 1 459.5 10.5 V36 Z" fill="#161b22"/>
    <circle cx="20" cy="18" r="5.5" fill="#ff5f57"/><circle cx="38" cy="18" r="5.5" fill="#febc2e"/><circle cx="56" cy="18" r="5.5" fill="#28c840"/>
    <text x="230" y="23" text-anchor="middle" class="label ok">WITH TERMRESCUE</text>
    <text class="mono" xml:space="preserve">
      <tspan x="18" y="66"><tspan class="prompt">PS C:\Users\me&gt;</tspan><tspan class="cmd"> ssh mac</tspan></tspan>
      <tspan x="18" y="90" class="dim">Connection to mac closed.</tspan>
      <tspan x="18" y="114" class="prompt">PS C:\Users\me&gt;</tspan>
      <tspan x="18" y="210" class="dim"># at the prompt, termrescue:</tspan>
      <tspan x="18" y="234" class="dim">#   switched mouse + focus reporting off</tspan>
      <tspan x="18" y="258" class="dim">#   repaired the console input mode</tspan>
      <tspan x="18" y="282" class="dim">#   dropped the queued garbage</tspan>
    </text>
    <rect x="156" y="101" width="9" height="17" fill="#3fb950"/>
  </g>
</svg>
